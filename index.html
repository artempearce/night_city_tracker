<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>NIGHT CITY // TRACKER</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07070b">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NC Tracker">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#07070b;
    --panel:#111118;
    --panel2:#16161f;
    --border:#2a2a36;
    --border-soft:#1c1c26;
    --yellow:#fcee0a;
    --cyan:#00e5ff;
    --magenta:#ff2bd6;
    --red:#ff2e4d;
    --green:#39ff14;
    --text:#e7e7f0;
    --dim:#84849a;
    --dim2:#4c4c5c;
    --font-display:'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Roboto Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(0,229,255,0.10), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(255,43,214,0.09), transparent 55%),
      var(--bg);
  }
  #scanlines{
    position:fixed;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  #shell{position:relative;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;z-index:2;}

  /* ---------- HEADER ---------- */
  #headerBar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(7,7,11,0.98), rgba(7,7,11,0.92));
    border-bottom:1px solid var(--border);
    padding:10px 14px 12px;
    backdrop-filter:blur(6px);
  }
  .hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .hdr-id{display:flex;align-items:center;gap:9px;cursor:pointer;min-width:0;}
  .avatar-wrap{flex-shrink:0;line-height:0;}
  .avatar-img{border-radius:50%;object-fit:cover;border:1.5px solid var(--yellow);display:block;}
  .avatar-fallback{border-radius:50%;border:1.5px solid var(--yellow);background:var(--panel2);color:var(--yellow);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;}
  .profile-edit{background:var(--panel2);border:1px solid var(--border);padding:13px;margin-bottom:16px;}
  .profile-edit .row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .profile-avatar-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .brand{
    font-family:var(--font-display);font-weight:800;font-style:italic;
    font-size:15px;letter-spacing:0.5px;color:var(--text);
    clip-path:polygon(0 0,100% 0,92% 100%,0% 100%);
  }
  .brand b{color:var(--yellow);}
  .brand-sub{font-size:9px;color:var(--dim);letter-spacing:2px;font-family:var(--font-mono);margin-top:1px;}
  #eddiesBadge{
    display:flex;align-items:center;gap:6px;
    background:var(--panel2);border:1px solid var(--border);
    padding:6px 10px;
    clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);
  }
  #eddiesBadge .val{font-family:var(--font-mono);font-weight:700;color:var(--yellow);font-size:14px;}
  #eddiesBadge .cur{font-size:10px;color:var(--dim);}
  #gearBtn{
    background:none;border:1px solid var(--border);color:var(--dim);
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    font-size:14px;cursor:pointer;margin-left:6px;flex-shrink:0;
  }
  #gearBtn:active{color:var(--yellow);border-color:var(--yellow);}

  .rank-strip{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .save-warning{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-top:8px;padding:6px 9px;
    background:rgba(255,46,77,0.08);border:1px solid var(--red);
    font-size:9.5px;color:var(--red);letter-spacing:0.3px;font-family:var(--font-mono);
  }
  .save-warning button{
    flex-shrink:0;background:none;border:1px solid var(--red);color:var(--red);
    font-family:var(--font-display);font-weight:700;font-size:9px;letter-spacing:0.5px;
    text-transform:uppercase;padding:4px 8px;cursor:pointer;
  }
  .rank-chip{
    font-family:var(--font-display);font-weight:800;font-size:11px;letter-spacing:1px;
    padding:4px 10px;white-space:nowrap;
    border:1px solid var(--rc);color:var(--rc);
    clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);
    text-transform:uppercase;
  }
  .lvl-track{flex:1;min-width:0;}
  .lvl-row{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-bottom:3px;}
  .bar{height:6px;background:var(--panel2);border:1px solid var(--border-soft);position:relative;overflow:hidden;}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--bc,var(--yellow)),var(--bc2,var(--yellow)));box-shadow:0 0 8px var(--bc,var(--yellow));}

  /* ---------- TABS ---------- */
  #tabbar{
    position:sticky;bottom:0;z-index:20;
    display:flex;overflow-x:auto;gap:2px;
    background:rgba(10,10,14,0.97);border-top:1px solid var(--border);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
    backdrop-filter:blur(6px);
  }
  .tab-btn{
    flex:1 0 auto;min-width:76px;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;color:var(--dim2);padding:7px 4px 6px;cursor:pointer;
    border-top:2px solid transparent;
  }
  .tab-btn .ic{font-size:16px;line-height:1;}
  .tab-btn .lb{font-size:9px;letter-spacing:0.5px;font-family:var(--font-display);font-weight:700;text-transform:uppercase;}
  .tab-btn.active{color:var(--yellow);border-top-color:var(--yellow);}
  .tab-btn.active .ic{filter:drop-shadow(0 0 4px rgba(252,238,10,0.7));}

  /* ---------- CONTENT ---------- */
  #content{flex:1;padding:14px 14px 26px;}
  .section-title{
    font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:1px;
    color:var(--text);margin:18px 0 10px;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;
  }
  .section-title:first-child{margin-top:2px;}
  .section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}

  .panel{
    background:var(--panel);border:1px solid var(--border);
    padding:14px;position:relative;
  }
  .panel-cut{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);}

  /* rank hero */
  .hero{
    background:linear-gradient(135deg, var(--panel), var(--panel2));
    border:1px solid var(--hc,var(--yellow));
    padding:18px 16px;position:relative;overflow:hidden;
    clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  }
  .hero::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(120deg, transparent 40%, var(--hc,var(--yellow)) 50%, transparent 60%);
    opacity:0.06;
  }
  .hero.legend{animation:legendPulse 2.6s ease-in-out infinite;}
  @keyframes legendPulse{0%,100%{box-shadow:0 0 10px rgba(252,238,10,0.25);}50%{box-shadow:0 0 26px rgba(252,238,10,0.55);}}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .hero-rankname{font-family:var(--font-display);font-weight:800;font-size:22px;font-style:italic;color:var(--hc,var(--yellow));letter-spacing:0.5px;}
  .hero-idx{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-top:2px;}
  .hero-level{text-align:right;}
  .hero-level .n{font-family:var(--font-mono);font-weight:700;font-size:26px;color:var(--text);line-height:1;}
  .hero-level .l{font-size:9px;color:var(--dim);letter-spacing:1px;}
  .hero-bar-row{margin-top:14px;}
  .hero-bar-nums{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-bottom:4px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
  .stat-cell{background:var(--panel);border:1px solid var(--border);padding:9px 6px;text-align:center;}
  .stat-cell .n{font-family:var(--font-mono);font-weight:700;font-size:16px;color:var(--cyan);}
  .stat-cell .l{font-size:8.5px;color:var(--dim);letter-spacing:0.3px;margin-top:2px;line-height:1.2;}

  .branch-mini{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--bc);
    padding:10px 12px;margin-bottom:8px;
  }
  .branch-mini .ic{font-size:18px;color:var(--bc);width:22px;text-align:center;flex-shrink:0;}
  .branch-mini .body{flex:1;min-width:0;}
  .branch-mini .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .branch-mini .top .nm{font-weight:600;}
  .branch-mini .top .lv{font-family:var(--font-mono);color:var(--bc);font-size:11px;}

  /* branch full card */
  .branch-card{
    background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--bc);
    padding:14px;margin-bottom:12px;
  }
  .branch-card .head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .branch-card .ic{font-size:22px;color:var(--bc);}
  .branch-card .nm{font-family:var(--font-display);font-weight:800;font-size:15px;}
  .branch-card .lvbig{margin-left:auto;text-align:right;}
  .branch-card .lvbig .n{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--bc);}
  .branch-card .lvbig .l{font-size:8px;color:var(--dim);letter-spacing:1px;}
  .branch-card .foot{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--dim);font-family:var(--font-mono);}

  /* buttons */
  .btn{
    font-family:var(--font-display);font-weight:800;font-size:11.5px;letter-spacing:0.6px;
    border:1px solid var(--yellow);color:var(--yellow);background:rgba(252,238,10,0.06);
    padding:9px 14px;cursor:pointer;text-transform:uppercase;text-align:center;
    clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);
  }
  .btn:active{background:rgba(252,238,10,0.18);}
  .btn.full{width:100%;display:block;}
  .btn.ghost{color:var(--dim);border-color:var(--border);background:none;}
  .btn.ghost:active{color:var(--text);border-color:var(--dim);}
  .btn.cyan{color:var(--cyan);border-color:var(--cyan);background:rgba(0,229,255,0.06);}
  .btn.cyan:active{background:rgba(0,229,255,0.18);}
  .btn.red{color:var(--red);border-color:var(--red);background:rgba(255,46,77,0.06);}
  .btn.red:active{background:rgba(255,46,77,0.18);}
  .btn.sm{padding:6px 10px;font-size:10px;}
  .btn:disabled{opacity:0.35;pointer-events:none;}
  .btn-row{display:flex;gap:8px;}
  .btn-row .btn{flex:1;}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--dim);width:28px;height:28px;font-size:12px;cursor:pointer;flex-shrink:0;}
  .icon-btn:active{border-color:var(--red);color:var(--red);}

  /* segmented filter */
  .seg{display:flex;border:1px solid var(--border);margin-bottom:12px;}
  .seg-btn{flex:1;background:var(--panel);color:var(--dim);border:none;border-right:1px solid var(--border);padding:8px 4px;font-size:10.5px;font-family:var(--font-display);font-weight:700;letter-spacing:0.4px;text-transform:uppercase;cursor:pointer;}
  .seg-btn:last-child{border-right:none;}
  .seg-btn.active{background:var(--panel2);color:var(--yellow);}

  /* task cards */
  .task-card{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--tc);padding:11px 12px;margin-bottom:9px;}
  .task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .task-tag{font-size:8.5px;font-family:var(--font-display);font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:var(--tc);}
  .task-title{font-size:13.5px;font-weight:600;margin-top:3px;line-height:1.3;}
  .task-meta{display:flex;gap:10px;margin-top:8px;font-family:var(--font-mono);font-size:11px;}
  .task-meta .br{color:var(--dim);}
  .task-meta .xp{color:var(--cyan);}
  .task-meta .ed{color:var(--yellow);}
  .task-actions{display:flex;gap:8px;margin-top:10px;}
  .task-actions .btn{flex:1;}

  .empty-note{
    border:1px dashed var(--border);padding:18px 14px;text-align:center;color:var(--dim);
    font-size:12.5px;line-height:1.6;
  }
  .empty-note b{color:var(--text);}

  /* forms */
  .form-panel{background:var(--panel2);border:1px solid var(--border);padding:13px;margin-bottom:12px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:10px;color:var(--dim);letter-spacing:0.5px;margin-bottom:4px;text-transform:uppercase;font-family:var(--font-display);font-weight:700;}
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:8px 9px;font-size:13px;font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--yellow);}
  .field-row{display:flex;gap:8px;}
  .field-row .field{flex:1;}
  .type-toggle{display:flex;gap:8px;margin-bottom:10px;}
  .type-toggle button{flex:1;padding:8px;border:1px solid var(--border);background:var(--bg);color:var(--dim);font-size:11px;font-family:var(--font-display);font-weight:700;text-transform:uppercase;cursor:pointer;}
  .type-toggle button.active.quest{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,0.08);}
  .type-toggle button.active.boss{border-color:var(--red);color:var(--red);background:rgba(255,46,77,0.08);}
  .swatch-row{display:flex;flex-wrap:wrap;gap:8px;}
  .swatch{width:28px;height:28px;border-radius:50%;background:var(--sc);border:2px solid transparent;cursor:pointer;padding:0;}
  .swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--bg), 0 0 0 3px var(--sc);}

  /* shop */
  .shop-card{background:var(--panel);border:1px solid var(--border);padding:12px;margin-bottom:9px;display:flex;gap:10px;align-items:center;}
  .shop-card .body{flex:1;min-width:0;}
  .shop-card .nm{font-weight:700;font-size:13.5px;}
  .shop-card .ds{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.4;}
  .shop-card .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
  .cost-tag{font-family:var(--font-mono);color:var(--yellow);font-weight:700;font-size:13px;white-space:nowrap;}

  /* achievements */
  .ach-card{background:var(--panel);border:1px solid var(--border);padding:12px;margin-bottom:9px;position:relative;}
  .ach-card.locked{opacity:0.55;}
  .ach-card.unlocked{border-color:var(--green);box-shadow:0 0 0 1px rgba(57,255,20,0.15) inset;}
  .ach-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ach-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px;}
  .ach-badge{font-size:8px;font-family:var(--font-mono);color:var(--dim2);border:1px solid var(--border);padding:1px 5px;letter-spacing:0.5px;}
  .ach-desc{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.4;}
  .ach-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;}
  .ach-reward{font-family:var(--font-mono);font-size:11px;color:var(--cyan);}
  .ach-reward .ed{color:var(--yellow);margin-left:8px;}
  .ach-progress{font-family:var(--font-mono);font-size:10px;color:var(--dim2);margin-top:6px;}

  /* log */
  .log-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border-soft);}
  .log-ic{width:26px;height:26px;flex-shrink:0;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--lc);}
  .log-body{flex:1;min-width:0;}
  .log-title{font-size:12.5px;font-weight:600;}
  .log-sub{font-size:10.5px;color:var(--dim);margin-top:2px;font-family:var(--font-mono);}
  .log-time{font-size:9.5px;color:var(--dim2);margin-top:2px;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(4,4,7,0.82);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);}
  .modal{width:100%;max-width:560px;background:var(--panel);border-top:1px solid var(--yellow);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow-y:auto;}
  .modal-title{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:0.5px;text-transform:uppercase;color:var(--yellow);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .modal-close{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;}
  .modal .btn.full{margin-bottom:9px;}
  .danger-zone{margin-top:18px;padding-top:14px;border-top:1px dashed var(--border);}
  .danger-zone .lbl{font-size:10px;color:var(--red);letter-spacing:1px;font-family:var(--font-display);font-weight:700;margin-bottom:8px;text-transform:uppercase;}

  /* toasts */
  #toastContainer{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;max-width:520px;padding:0 12px;pointer-events:none;}
  .toast{
    background:rgba(12,12,17,0.95);border:1px solid var(--tc,var(--cyan));color:var(--text);
    padding:9px 16px;font-size:12px;font-family:var(--font-mono);
    opacity:0;transform:translateY(-10px);transition:opacity 0.35s ease, transform 0.35s ease;
    box-shadow:0 0 14px rgba(0,0,0,0.5);
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.toast-level{--tc:var(--yellow);color:var(--yellow);}
  .toast.toast-rank{--tc:var(--magenta);color:var(--magenta);}
  .toast.toast-achievement{--tc:var(--green);color:var(--green);}
  .toast.toast-error{--tc:var(--red);color:var(--red);}
  .toast.toast-branch{--tc:var(--cyan);}

  .loading-screen{padding:80px 20px;text-align:center;color:var(--dim);font-family:var(--font-mono);font-size:12px;letter-spacing:2px;}

  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="scanlines"></div>
<div id="toastContainer"></div>
<input type="file" id="importFileInput" accept="application/json" style="display:none">
<input type="file" id="avatarFileInput" accept="image/*" style="display:none">
<div id="shell">
  <div id="app"><div class="loading-screen">ПОДКЛЮЧЕНИЕ К СЕТИ NIGHT CITY...</div></div>
</div>

<script>
/* =================== CONSTANTS =================== */
const RANKS = [
  {name:'Новичок', color:'#9ca3af'},
  {name:'Стритрэт', color:'#a8a15c'},
  {name:'Скавенджер', color:'#c2793b'},
  {name:'Раннер', color:'#e08e0b'},
  {name:'Дата-раннер', color:'#eab308'},
  {name:'Соло', color:'#84cc16'},
  {name:'Скриптер', color:'#22c55e'},
  {name:'Кибер-соло', color:'#10b981'},
  {name:'Техно-фанк', color:'#14b8a6'},
  {name:'Наёмник', color:'#06b6d4'},
  {name:'Киберпанк', color:'#0ea5e9'},
  {name:'Нетраннер', color:'#3b82f6'},
  {name:'Ветеран улиц', color:'#6366f1'},
  {name:'Элит-соло', color:'#8b5cf6'},
  {name:'Корп-агент', color:'#a855f7'},
  {name:'Хэдхантер', color:'#d946ef'},
  {name:'Фиксер', color:'#ec4899'},
  {name:'Эджраннер', color:'#f43f5e'},
  {name:'Призрак Найт-Сити', color:'#ef4444'},
  {name:'Легенда Найт-Сити', color:'#fcee0a'},
];

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function defaultState(){
  return {
    eddies:0,
    bonusXP:0,
    totalEddiesEarned:0,
    totalEddiesSpent:0,
    profile:{nickname:'', avatar:null},
    branchDefs:DEFAULT_BRANCHES.map(b=>({...b})),
    branches:{python:0, cyberdesign:0, bookworm:0, netrunner:0, cyberaffairs:0},
    tasks:[],
    log:[],
    shop:DEFAULT_SHOP.map(s=>({...s, id:uid()})),
    purchases:[],
    achievements:SYSTEM_ACHIEVEMENTS.map(a=>({...a, unlocked:false, unlockedAt:null})),
    activityDates:[],
    createdAt:Date.now(),
  };
}

function migrateState(loaded){
  const d = defaultState();
  const s = Object.assign({}, d, loaded||{});
  s.profile = Object.assign({}, d.profile, (loaded&&loaded.profile)||{});
  s.branchDefs = (loaded&&loaded.branchDefs&&loaded.branchDefs.length)?loaded.branchDefs:d.branchDefs;
  s.branches = Object.assign({}, d.branches, (loaded&&loaded.branches)||{});
  s.branchDefs.forEach(b=>{ if(typeof s.branches[b.key]!=='number') s.branches[b.key]=0; });
  s.tasks = (loaded&&loaded.tasks)||[];
  s.log = (loaded&&loaded.log)||[];
  s.shop = (loaded&&loaded.shop&&loaded.shop.length)?loaded.shop:d.shop;
  s.purchases = (loaded&&loaded.purchases)||[];
  s.activityDates = (loaded&&loaded.activityDates)||[];
  s.totalEddiesEarned = typeof loaded?.totalEddiesEarned==='number' ? loaded.totalEddiesEarned : 0;
  s.totalEddiesSpent = typeof loaded?.totalEddiesSpent==='number' ? loaded.totalEddiesSpent : 0;
  const existing = (loaded&&loaded.achievements)||[];
  const sysMap = {}; SYSTEM_ACHIEVEMENTS.forEach(sa=>{ sysMap[sa.id]=sa; });
  const existingIds = new Set(existing.map(a=>a.id));
  // Системные достижения обновляем до актуального названия/описания/награды
  // (чтобы правки задним числом применялись и к уже сохранённому прогрессу),
  // но статус выполнения (unlocked/unlockedAt) сохраняем как есть.
  // Личные достижения пользователя не трогаем.
  s.achievements = existing.map(a=> sysMap[a.id] ? {...sysMap[a.id], unlocked:a.unlocked, unlockedAt:a.unlockedAt} : a);
  SYSTEM_ACHIEVEMENTS.forEach(sa=>{ if(!existingIds.has(sa.id)) s.achievements.push({...sa, unlocked:false, unlockedAt:null}); });
  s.eddies = typeof loaded?.eddies==='number' ? loaded.eddies : 0;
  s.bonusXP = typeof loaded?.bonusXP==='number' ? loaded.bonusXP : 0;
  return s;
}

/* =================== STORAGE (localStorage браузера устройства) =================== */
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){
    console.error('load failed', e);
  }
  return null;
}
function trimState(){
  // Не даём журналу и истории расти бесконечно.
  const MAX_LOG = 500;
  if(STATE.log.length > MAX_LOG) STATE.log = STATE.log.slice(0, MAX_LOG);
  const MAX_PURCHASES = 500;
  if(STATE.purchases.length > MAX_PURCHASES) STATE.purchases = STATE.purchases.slice(-MAX_PURCHASES);
  const MAX_DATES = 400;
  if(STATE.activityDates.length > MAX_DATES) STATE.activityDates = STATE.activityDates.slice(-MAX_DATES);
}

function persist(){
  let payload;
  try{
    trimState();
    payload = JSON.stringify(STATE);
  }catch(e){
    console.error('serialize failed', e);
    showToast({text:'ОШИБКА ОБРАБОТКИ ДАННЫХ', kind:'error'});
    return;
  }
  try{
    localStorage.setItem(STORAGE_KEY, payload);
    if(!saveOk){
      saveOk = true;
      showToast({text:'СОХРАНЕНИЕ ВОССТАНОВЛЕНО', kind:'achievement'});
      render();
    }
  }catch(e){
    console.error('save failed', e);
    if(saveOk){
      saveOk = false;
      showToast({text:'НЕ УДАЛОСЬ СОХРАНИТЬ В ЭТОМ БРАУЗЕРЕ. ЭКСПОРТИРУЙ ПРОГРЕСС ВРУЧНУЮ', kind:'error'});
      render();
    }
  }
}
function retrySave(){

/* =================== LEVEL / RANK MATH =================== */
function xpToNext(level){ return 100 + (level-1)*25; }
function computeLevel(totalXP){
  let level=1, rem=Math.max(0,totalXP||0);
  while(rem >= xpToNext(level)){ rem -= xpToNext(level); level++; }
  return {level, into:rem, need:xpToNext(level)};
}
function getBranchLevel(key){ return computeLevel(STATE.branches[key]||0); }
function getAccountXP(){
  return STATE.branchDefs.reduce((s,b)=>s+(STATE.branches[b.key]||0),0) + (STATE.bonusXP||0);
}
function getAccountLevel(){ return computeLevel(getAccountXP()); }
function getRankIndex(level){ return Math.min(20, Math.floor((level-1)/5)+1); }
function getRank(level){ const idx=getRankIndex(level); return {...RANKS[idx-1], index:idx}; }

function calcStreak(dates){
  const set = new Set(dates||[]);
  function fmt(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
  let cursor = new Date();
  if(!set.has(fmt(cursor))){
    cursor.setDate(cursor.getDate()-1);
    if(!set.has(fmt(cursor))) return 0;
  }
  let streak=0;
  while(set.has(fmt(cursor))){ streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
}
function todayStr(){
  const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function countLog(type){ return STATE.log.filter(e=>e.type===type).length; }

/* =================== ACHIEVEMENT CONDITIONS =================== */
function evalCondition(cond){
  switch(cond){
    case 'first_quest': return countLog('quest')>=1;
    case 'boss_3': return countLog('boss')>=3;
    case 'purchase_1': return countLog('purchase')>=1;
    case 'streak_7': return calcStreak(STATE.activityDates)>=7;
    case 'all_branches_5': return STATE.branchDefs.every(b=>getBranchLevel(b.key).level>=5);
    case 'branch_5_python': return getBranchLevel('python').level>=5;
    case 'branch_5_cyberdesign': return getBranchLevel('cyberdesign').level>=5;
    case 'branch_5_bookworm': return getBranchLevel('bookworm').level>=5;
    case 'branch_5_netrunner': return getBranchLevel('netrunner').level>=5;
    case 'branch_5_cyberaffairs': return getBranchLevel('cyberaffairs').level>=5;
    case 'rank_10': return getRankIndex(getAccountLevel().level)>=10;
    case 'rank_20': return getRankIndex(getAccountLevel().level)>=20;
    case 'eddies_total_1m': return (STATE.totalEddiesEarned||0)>=1000000;
    case 'eddies_spent_50k': return (STATE.totalEddiesSpent||0)>=50000;
    default: return false;
  }
}
function achievementProgress(cond){
  switch(cond){
    case 'first_quest': return Math.min(countLog('quest'),1)+' / 1';
    case 'boss_3': return Math.min(countLog('boss'),3)+' / 3';
    case 'purchase_1': return Math.min(countLog('purchase'),1)+' / 1';
    case 'streak_7': return Math.min(calcStreak(STATE.activityDates),7)+' / 7 дн.';
    case 'all_branches_5': return STATE.branchDefs.filter(b=>getBranchLevel(b.key).level>=5).length+' / '+STATE.branchDefs.length+' веток';
    case 'branch_5_python': return Math.min(getBranchLevel('python').level,5)+' / 5 ур.';
    case 'branch_5_cyberdesign': return Math.min(getBranchLevel('cyberdesign').level,5)+' / 5 ур.';
    case 'branch_5_bookworm': return Math.min(getBranchLevel('bookworm').level,5)+' / 5 ур.';
    case 'branch_5_netrunner': return Math.min(getBranchLevel('netrunner').level,5)+' / 5 ур.';
    case 'branch_5_cyberaffairs': return Math.min(getBranchLevel('cyberaffairs').level,5)+' / 5 ур.';
    case 'rank_10': return Math.min(getRankIndex(getAccountLevel().level),10)+' / 10 ранг';
    case 'rank_20': return Math.min(getRankIndex(getAccountLevel().level),20)+' / 20 ранг';
    case 'eddies_total_1m': return fmtNum(Math.min(STATE.totalEddiesEarned||0,1000000))+' / 1 000 000 €$';
    case 'eddies_spent_50k': return fmtNum(Math.min(STATE.totalEddiesSpent||0,50000))+' / 50 000 €$';
    default: return null;
  }
}
function checkAchievements(){
  const unlocked=[];
  STATE.achievements.forEach(a=>{
    if(!a.unlocked && a.cond && a.cond!=='manual' && evalCondition(a.cond)){
      a.unlocked=true; a.unlockedAt=Date.now();
      STATE.bonusXP += (a.xp||0);
      STATE.eddies += (a.eddies||0);
      STATE.totalEddiesEarned += (a.eddies||0);
      STATE.log.unshift({id:uid(), type:'achievement', title:a.name, xp:a.xp, eddies:a.eddies, at:Date.now()});
      unlocked.push(a);
    }
  });
  return unlocked;
}

/* =================== ACTIONS =================== */
function commit(mutate){
  const prevLevel = getAccountLevel().level;
  const prevRank = getRank(prevLevel).name;
  const prevBranchLv = {}; STATE.branchDefs.forEach(b=>prevBranchLv[b.key]=getBranchLevel(b.key).level);

  mutate();
  const newUnlocked = checkAchievements();
  persist();

  const newLevel = getAccountLevel().level;
  const newRank = getRank(newLevel).name;
  const toasts=[];
  STATE.branchDefs.forEach(b=>{
    const nl = getBranchLevel(b.key).level;
    if(nl>prevBranchLv[b.key]) toasts.push({text:`${b.name.toUpperCase()}: УРОВЕНЬ ${nl}`, kind:'branch', color:b.color});
  });
  if(newLevel>prevLevel) toasts.push({text:`НОВЫЙ УРОВЕНЬ АККАУНТА: ${newLevel}`, kind:'level'});
  if(newRank!==prevRank) toasts.push({text:`НОВОЕ ЗВАНИЕ: ${newRank.toUpperCase()}`, kind:'rank'});
  newUnlocked.forEach(a=>toasts.push({text:`ДОСТИЖЕНИЕ: ${a.name}`, kind:'achievement'}));

  render();
  toasts.forEach((t,i)=>setTimeout(()=>showToast(t), i*350));
}

function addTask(type,title,branch,xp,eddies){
  if(!title || !title.trim()) return;
  commit(()=>{
    STATE.tasks.unshift({id:uid(), type, title:title.trim(), branch,
      xp:Math.max(0,parseInt(xp)||0), eddies:Math.max(0,parseInt(eddies)||0), createdAt:Date.now()});
  });
}
function completeTask(id){
  commit(()=>{
    const idx = STATE.tasks.findIndex(t=>t.id===id);
    if(idx<0) return;
    const t = STATE.tasks[idx];
    STATE.tasks.splice(idx,1);
    STATE.branches[t.branch] = (STATE.branches[t.branch]||0) + t.xp;
    STATE.eddies += t.eddies;
    STATE.totalEddiesEarned += t.eddies;
    const today = todayStr();
    if(!STATE.activityDates.includes(today)) STATE.activityDates.push(today);
    STATE.log.unshift({id:uid(), type:t.type, title:t.title, branch:t.branch, xp:t.xp, eddies:t.eddies, at:Date.now()});
  });
}
function deleteTask(id){

}

function deleteBranch(key){
  if(STATE.branchDefs.length<=1){ showToast({text:'НУЖНА ХОТЯ БЫ ОДНА ВЕТВЬ', kind:'error'}); return; }
  const b = branchByKey(key);

function resizeImageFile(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        try{
          const canvas = document.createElement('canvas');
          canvas.width = maxSize; canvas.height = maxSize;
          const ctx = canvas.getContext('2d');
          const s = Math.min(img.width, img.height);
          const sx = (img.width-s)/2, sy = (img.height-s)/2;
          ctx.drawImage(img, sx, sy, s, s, 0, 0, maxSize, maxSize);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        }catch(err){ reject(err); }
      };
      img.onerror = ()=>reject(new Error('image load failed'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

function buyItem(id){
  const item = STATE.shop.find(s=>s.id===id);
  if(!item) return;
  if(STATE.eddies < item.cost){ showToast({text:'НЕДОСТАТОЧНО €$', kind:'error'}); return; }

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed || typeof parsed!=='object' || !parsed.branches){
        showToast({text:'ФАЙЛ ПОВРЕЖДЁН ИЛИ НЕВЕРНОГО ФОРМАТА', kind:'error'});
        return;
      }
      if(confirm('Заменить текущий прогресс данными из файла? Это действие необратимо.')){
        STATE = migrateState(parsed);
        persist(); render();
        showToast({text:'ДАННЫЕ ИМПОРТИРОВАНЫ', kind:'achievement'});
      }
    }catch(err){
      showToast({text:'НЕ УДАЛОСЬ ПРОЧИТАТЬ ФАЙЛ', kind:'error'});
    }
    e.target.value='';
  };
  reader.readAsText(file);
}

/* =================== TOASTS =================== */
function showToast({text, kind='info', color}){
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast toast-'+kind;
  if(color) el.style.setProperty('--tc', color);
  el.textContent = text;
  container.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),400); }, 3400);
}

/* =================== HELPERS =================== */
function fmtNum(n){ return Math.round(n||0).toLocaleString('ru-RU'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function branchByKey(k){
  return STATE.branchDefs.find(b=>b.key===k) || {key:k, name:'Удалённая ветвь', icon:'✕', color:'#5c5c6e'};
}
function fmtDT(ts){
  return new Date(ts).toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

document.getElementById('shell').addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  // Клик на фон-оверлей закрывает модалку; клик на пустое место внутри самого
  // окна (не по кнопке) не должен закрывать её.
  if(action==='close-settings' && el.classList.contains('overlay') && e.target!==el) return;

  switch(action){
    case 'set-tab': UI.tab = el.dataset.tab; UI.showAddTask=false; UI.showAddShop=false; UI.showAddAch=false; UI.showAddBranch=false; render(); break;

    case 'toggle-add-branch': UI.showAddBranch = !UI.showAddBranch; UI.newBranchColor = BRANCH_COLOR_PALETTE[0]; render(); break;
    case 'cancel-add-branch': UI.showAddBranch = false; render(); break;
    case 'pick-branch-color': UI.newBranchColor = el.dataset.color; render(); break;
    case 'submit-branch': {
      const name = document.getElementById('branchNameInput').value;
      const icon = document.getElementById('branchIconInput').value;
      UI.showAddBranch = false;
      addBranch(name, icon, UI.newBranchColor);
      break;
    }
    case 'delete-branch': deleteBranch(id); break;
    case 'toggle-add-task': UI.showAddTask = !UI.showAddTask; render(); break;
    case 'cancel-add-task': UI.showAddTask = false; render(); break;
    case 'set-task-type': UI.taskType = el.dataset.type; render(); break;
    case 'submit-task': {
      const title = document.getElementById('taskTitleInput').value;
      const branch = document.getElementById('taskBranchSelect').value;
      const xp = document.getElementById('taskXpInput').value;
      const eddies = document.getElementById('taskEddiesInput').value;
      UI.showAddTask=false;
      addTask(UI.taskType, title, branch, xp, eddies);
      break;
    }
    case 'complete-task': completeTask(id); break;
    case 'delete-task': deleteTask(id); break;
    case 'set-task-filter': UI.taskFilter = el.dataset.filter; render(); break;

    case 'toggle-add-shop': UI.showAddShop = !UI.showAddShop; render(); break;
    case 'cancel-add-shop': UI.showAddShop = false; render(); break;
    case 'submit-shop': {
      const name = document.getElementById('shopNameInput').value;
      const desc = document.getElementById('shopDescInput').value;
      const cost = document.getElementById('shopCostInput').value;
      UI.showAddShop=false;
      addShopItem(name, desc, cost);
      break;
    }
    case 'buy-item': buyItem(id); break;
    case 'delete-shop': deleteShopItem(id); break;

    case 'toggle-add-ach': UI.showAddAch = !UI.showAddAch; render(); break;
    case 'cancel-add-ach': UI.showAddAch = false; render(); break;
    case 'submit-ach': {
      const name = document.getElementById('achNameInput').value;
      const desc = document.getElementById('achDescInput').value;
      const xp = document.getElementById('achXpInput').value;
      const eddies = document.getElementById('achEddiesInput').value;
      UI.showAddAch=false;
      addAchievementCustom(name, desc, xp, eddies);
      break;
    }
    case 'claim-ach': claimAchievement(id); break;
    case 'delete-ach': deleteAchievementCustom(id); break;

    case 'set-log-filter': UI.logFilter = el.dataset.filter; render(); break;

    case 'open-settings': UI.showSettings = true; render(); break;
    case 'close-settings': UI.showSettings = false; render(); break;
    case 'retry-save': retrySave(); break;
    case 'pick-avatar': document.getElementById('avatarFileInput').click(); break;
    case 'remove-avatar': removeAvatar(); break;
    case 'save-profile': {
      const nickname = document.getElementById('nicknameInput').value;
      saveProfile(nickname);
      break;
    }
    case 'export-data': exportData(); break;
    case 'import-trigger': document.getElementById('importFileInput').click(); break;
    case 'reset-all':
      if(confirm('Стереть весь прогресс без возможности восстановления? Рекомендуем сначала сделать экспорт.')){
        UI.showSettings = false;
        resetAll();
      }
      break;
  }
});
document.getElementById('importFileInput').addEventListener('change', handleImportFile);
document.getElementById('avatarFileInput').addEventListener('change', handleAvatarFile);

/* =================== INIT =================== */
/* =================== PWA: SERVICE WORKER =================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>{
      // На file:// и в некоторых песочницах service worker недоступен —
      // это ожидаемо и не мешает работе самого трекера.
      console.log('SW registration skipped:', err && err.message);
    });
  });
}

function init(){
  const loaded = loadState();
  STATE = loaded ? migrateState(loaded) : defaultState();
  render();
}
init();
</script>
</body>
</html>
